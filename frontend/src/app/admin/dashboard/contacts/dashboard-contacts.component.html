<ng-container *ngIf="recentContacts.length">
  <h2 class="section-label">
    {{ 'admin.recent_activity' | translate }}
    <span *ngIf="unreadCount > 0" class="section-unread-badge" [attr.aria-label]="unreadCount + ' unread'">{{ unreadCount }}</span>
  </h2>
  <div class="contacts-list card">
    <div class="contacts-toolbar">
      <label class="contacts-toolbar__select-all">
        <input type="checkbox" class="contact-checkbox" [checked]="allSelected" (change)="toggleSelectAll()" aria-label="Select all messages">
        <span class="contacts-toolbar__label">
          <ng-container *ngIf="anySelected">{{ selectedIds.size }}&nbsp;{{ 'admin.selected' | translate }}</ng-container>
          <ng-container *ngIf="!anySelected">{{ 'admin.select_all' | translate }}</ng-container>
        </span>
      </label>
      <button *ngIf="anySelected" type="button" class="contacts-delete-btn" [disabled]="bulkDeleting" (click)="deleteSelected()">
        <mat-icon [class.spin]="bulkDeleting">{{ bulkDeleting ? 'sync' : 'delete_sweep' }}</mat-icon>
        {{ bulkDeleting ? ('common.loading' | translate) : ('admin.delete_selected' | translate) }}
      </button>
    </div>

    <div *ngFor="let c of recentContacts; trackBy: trackByContact" class="contact-row" [class.contact-row--unread]="!c.read" [class.contact-row--selected]="c._id && selectedIds.has(c._id)">
      <div class="contact-check-cell" (click)="$event.stopPropagation()">
        <input type="checkbox" class="contact-checkbox" [checked]="c._id ? selectedIds.has(c._id) : false" (change)="c._id ? toggleSelectContact(c._id) : null" [attr.aria-label]="'Select message from ' + c.name">
      </div>
      <button type="button" class="contact-row__btn" (click)="openContact(c)">
        <div class="contact-icon"><mat-icon>mail_outline</mat-icon></div>
        <div class="contact-body">
          <span class="contact-name" [class.contact-name--unread]="!c.read">{{ c.name }}</span>
          <span class="contact-email text-muted">{{ c.email }}</span>
          <span class="contact-subject">{{ c.subject }} <span *ngIf="!c.read" class="contact-badge">{{ 'admin.new_badge' | translate }}</span></span>
        </div>
        <span class="contact-date text-muted">{{ c.createdAt | date:'dd/MM/yy' }}</span>
      </button>
    </div>
  </div>
</ng-container>
