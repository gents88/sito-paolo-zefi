<section id="hero" class="hero">
  <div class="hero-bg">
    <div class="hero-bg-image" #heroBgImage></div>
    <!-- Canvas particelle dorate (Three.js equivalent) -->
    <canvas #atmosphereCanvas class="atmosphere-canvas"></canvas>
    <div class="hero-overlay"></div>
    <div class="hero-fog fog-1"></div>
    <div class="hero-fog fog-2"></div>
    <div class="hero-vignette"></div>
  </div>

  <!-- Aquila albanese / bandiera -->
  <div class="hero-flag" aria-hidden="true">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="flag-svg">
      <defs>
        <radialGradient id="goldGradHero" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f4d27a"/>
          <stop offset="60%" stop-color="#b8860b"/>
          <stop offset="100%" stop-color="#5e3a0a"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGradHero)" stroke-width="2"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#b8860b" stroke-width="1" stroke-dasharray="2 4"/>
      <g fill="url(#goldGradHero)" stroke="#3a1d0a" stroke-width="0.8">
        <path d="M100 55 L88 70 Q70 75 60 92 Q72 88 80 95 Q72 105 78 120 Q86 112 95 118 L100 140 L105 118 Q114 112 122 120 Q128 105 120 95 Q128 88 140 92 Q130 75 112 70 Z"/>
        <circle cx="88" cy="72" r="3"/>
        <circle cx="112" cy="72" r="3"/>
        <path d="M85 68 L82 60 L88 64 Z"/>
        <path d="M115 68 L118 60 L112 64 Z"/>
      </g>
      <text x="100" y="170" text-anchor="middle" font-family="Cinzel, serif" font-size="10" fill="#b8860b" letter-spacing="3">PAULIN ZEFI</text>
    </svg>
  </div>

  <div class="hero-content">
    <div class="hero-eyebrow">
      <span class="eyebrow-line"></span>
      <span class="eyebrow-text">{{ 'sections.hero.eyebrow' | translate }}</span>
      <span class="eyebrow-line"></span>
    </div>

    <h1 class="hero-title">
      <span class="title-word" [class.animate]="titleAnimated">PAULIN</span>
      <span class="title-word" [class.animate]="titleAnimated">ZEFI</span>
    </h1>

    <p class="hero-subtitle">{{ 'sections.hero.subtitle' | translate }}</p>

    <div class="hero-divider">
      <span class="ornament">&#10086;</span>
    </div>

    <div class="hero-cta">
      <a href="#biografia" class="btn btn-primary">
        <span>{{ 'sections.hero.discover_story' | translate }}</span>
        <i class="fa-solid fa-scroll"></i>
      </a>
      <a href="#pubblicazioni" class="btn btn-outline">
        <span>{{ 'sections.hero.publications' | translate }}</span>
        <i class="fa-solid fa-book-open"></i>
      </a>
      <a href="#contatti" class="btn btn-ghost">
        <span>{{ 'sections.hero.contacts' | translate }}</span>
        <i class="fa-solid fa-feather"></i>
      </a>
    </div>

    <div class="hero-scroll-indicator">
      <span>{{ 'sections.hero.scroll' | translate }}</span>
      <div class="scroll-line"></div>
    </div>
  </div>

  <button class="audio-toggle" [class.playing]="audio.isPlaying()" (click)="toggleAudio()" [attr.aria-label]="'sections.hero.toggle_audio' | translate">
    <i [class]="audio.isPlaying() ? 'fa-solid fa-volume-high' : 'fa-solid fa-music'"></i>
  </button>
</section>
