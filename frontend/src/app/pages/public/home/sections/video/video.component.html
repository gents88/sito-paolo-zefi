<section id="video" class="video-section">
  <div class="section-header reveal">
    <span class="section-tag">{{ 'sections.video.chapter' | translate }}</span>
    <h2 class="section-title">{{ 'sections.video.title' | translate }}</h2>
    <p class="section-subtitle">{{ 'sections.video.description' | translate }}</p>
  </div>

  <div class="video-grid reveal">
    <div class="video-card" *ngFor="let video of videos; let i = index" [class.featured]="i === 0">
      <div class="video-thumb">
        <iframe [src]="video.embedUrl" [title]="video.title" frameborder="0" allowfullscreen loading="lazy"></iframe>
      </div>
      <div class="video-info">
        <h3>{{ video.title }}</h3>
        <p>{{ video.description }}</p>
      </div>
    </div>
  </div>
</section>
