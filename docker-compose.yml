version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: sito-paulo-zefi-mongodb
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - sito-network
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sito-paulo-zefi-backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: mongodb://mongodb:27017/sito_db?replicaSet=rs0
      JWT_SECRET: super_secret_key
      JWT_EXPIRATION: 24h
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - sito-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sito-paulo-zefi-frontend
    ports:
      - '4200:4200'
    environment:
      API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - sito-network

volumes:
  mongodb_data:

networks:
  sito-network:
    driver: bridge
